[project]
name = "network-analyser"
# SemVer 0.y.z (decision #32). The release workflow checks this against the tag;
# network_analyser/_version.py must say the same, and tests/arch/test_project.py checks it.
version = "0.1.0"
description = "Read-only discovery, encrypted config backup and topology diagrams for Cisco IOS/IOS-XE and NX-OS over SSH."
# python.org CPython 3.14; the exact patch is pinned in .python-version (ticket #38, #32).
requires-python = ">=3.14,<3.15"
dependencies = [
    # Paramiko 5.x: SHA-1 key exchange and ssh-rsa signatures removed (decision #2).
    "netmiko>=4.8,<4.9",
    "paramiko>=5.1,<6",
    "textfsm>=2.1,<3",
    "ntc-templates>=9.3,<10",
    "pyrage>=1.4,<2",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "types-paramiko==5.1.0.20261030",
]

[tool.uv]
# Not built or installed as a package: `uv sync --locked --no-build` (decisions #32, #44, #47)
# installs only locked wheels, and the tool runs as `python -m network_analyser`.
package = false
no-build = true
required-version = ">=0.13"
# Never use a Python that uv downloaded: only an installed python.org CPython (ticket #38).
python-preference = "only-system"
python-downloads = "never"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "security: one of the six v1 security tests (spec #37, Testing Decisions); build.ps1 and the release gate run these",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no copyright header required
    "D203",   # pick D211 (no blank line before class docstring)
    "D213",   # pick D212 (summary on the first line)
    "TC001",  # Python 3.14 evaluates annotations lazily; plain imports are clearer
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
# Only `cli` talks to the console (CODING_STANDARDS.md, "Output").
"network_analyser/cli/**" = ["T201"]
# The one place that switches the netmiko and paramiko loggers off.
"network_analyser/cli/library_loggers.py" = ["TID251"]
# The one file that reads the environment: LOCALAPPDATA, by literal name (#42).
"network_analyser/_winsys/paths.py" = ["TID251"]
"tests/**" = [
    "S101",    # assert is how pytest checks
    "D",       # test names are the documentation
    "PLR2004", # literal expected values are the point of a test
    "TID251",  # tests may use banned APIs to prove the product does not (pickle, logging)
]
"scripts/**" = ["INP001", "T201", "S603", "TID251"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Secrets are never read from the environment (CLAUDE.md). The one non-secret owner of
# environment reads (the per-user folder) is `_winsys`; give it a per-file ignore when it lands.
"os.environ".msg = "Secrets never come from the environment. Only _winsys reads named, non-secret variables."
"os.environb".msg = "Secrets never come from the environment."
"os.getenv".msg = "Secrets never come from the environment. Only _winsys reads named, non-secret variables."
"os.getenvb".msg = "Secrets never come from the environment."
"os.putenv".msg = "The tool never changes its environment."
"getpass".msg = "Use the cli masked reader (decision #29), which returns a Secret."
"faulthandler.enable".msg = "faulthandler stays off (spec #37)."
"faulthandler.register".msg = "faulthandler stays off (spec #37)."
"faulthandler.dump_traceback_later".msg = "faulthandler stays off (spec #37)."
"logging".msg = "Our own files never use logging (spec #37). Only cli/library_loggers.py touches it."
"traceback".msg = "Tracebacks can print exception text. Use cli.crash.describe_internal_error."
"pickle".msg = "Never serialise objects to disk; write plain records as text through the writers."
"marshal".msg = "Never serialise objects to disk."
"shelve".msg = "Never serialise objects to disk."
"ftplib".msg = "The tool talks to devices over SSH only, through device_gateway."
"urllib.request".msg = "The tool makes no HTTP requests in v1."
"http.client".msg = "The tool makes no HTTP requests in v1."
"ssl._create_unverified_context".msg = "Never turn certificate checks off."
"subprocess".msg = "The tool starts no other programs."
"paramiko.AutoAddPolicy".msg = "Host keys are checked against the Trust Store (ADR 0002)."
"paramiko.WarningPolicy".msg = "Host keys are checked against the Trust Store (ADR 0002)."
"tempfile.NamedTemporaryFile".msg = "Write files only through the writer helpers (temp-then-rename)."

[tool.ruff.format]
line-ending = "auto"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
files = ["network_analyser", "tests", "scripts"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "explicit-override",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
# No type information is published for these.
module = ["textfsm", "textfsm.*", "ntc_templates", "ntc_templates.*", "yaml"]
ignore_missing_imports = true
