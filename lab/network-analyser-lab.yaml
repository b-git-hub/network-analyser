lab:
  description: >-
    Network Analyser v1 test lab: three IOS-XE and two NX-OS nodes with CDP/LLDP
    Links, two port-channels, a trunk with a deliberate VLAN Mismatch, OSPF and a
    shared subnet. Addresses are documentation ranges; every password is CHANGE_ME.
  notes: |-
    # Network Analyser v1 test lab

    Follow `docs/lab-checklist.md` in the network-analyser repo for every booking.
    This file is `lab/network-analyser-lab.yaml` there.

    **Before the first start**

    - Management addresses are placeholders in 192.0.2.0/24 (gateway 192.0.2.1).
      Replace them with addresses from the sandbox's management subnet, as listed
      on the reservation page. Data-plane addresses (198.51.100.0/24,
      203.0.113.0/24) stay as they are: they never leave the lab.
    - Every password, secret and key is `CHANGE_ME`. Management interfaces boot
      shut down. Set the login passwords by hand at each node's console, then
      bring the management interface up.

    **What the lab holds**

    - xe-rtr1 (Catalyst 8000V), xe-sw1 and xe-sw2 (IOL-L2, IOS-XE),
      nx-sw1 and nx-sw2 (NX-OS 9000v).
    - Port-channel1 (LACP) between xe-sw1 and xe-sw2, and between nx-sw1 and nx-sw2.
    - Deliberate VLAN Mismatch on the xe-sw1 Ethernet0/3 <-> nx-sw1 Ethernet1/3
      trunk: native VLAN 1 against 99, VLAN 30 only on xe-sw1, VLAN 99 only on
      nx-sw1.
    - OSPF area 0 (HMAC-SHA-256 key chain) on three routed /31 links and on VLAN 10.
    - Shared subnet 198.51.100.0/25 on VLAN 10 across all four switches, with an
      HSRP address on the two IOS-XE switches. Two-device subnet
      198.51.100.128/25 on VLAN 20 (xe-sw2 and nx-sw2, no routing protocol).
    - The tool's dedicated account `netanalyser`, with the Device Role that
      `network-analyser role-snippet` prints (IOS-XE CLI view NA-READ, NX-OS
      role NA-READ). `python -m scripts.lab_roles` regenerates it.
  title: Network Analyser v1 lab
  version: 0.2.2
