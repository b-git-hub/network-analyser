  - boot_disk_size: null
    configuration:
      - name: nxos_config.txt
        content: |-
          hostname nx-sw1
          # Network Analyser lab node. Synthetic lab: every address is from the
          # documentation ranges and every password, secret and key is CHANGE_ME.
          # Set the login passwords by hand at the console, then bring mgmt0 up
          # (docs/lab-checklist.md, "Set up the lab").
          #
          # CML's default workaround for NX-OS 9000v booting to the loader> prompt
          echo 'from cli import cli' > set_boot.py
          echo 'import json' >> set_boot.py
          echo 'import os' >> set_boot.py
          echo 'import time' >> set_boot.py
          echo 'bootimage = json.loads(cli("show version | json"))["nxos_file_name"]' >> set_boot.py
          echo 'set_boot = cli("conf t ; boot nxos {} ; no event manager applet BOOTCONFIG".format(bootimage))' >> set_boot.py
          echo 'i = 0' >> set_boot.py
          echo 'while i < 10:' >> set_boot.py
          echo '    try:' >> set_boot.py
          echo '        save_config = cli("copy running-config startup-config")' >> set_boot.py
          echo '        break' >> set_boot.py
          echo '    except Exception:' >> set_boot.py
          echo '        i += 1' >> set_boot.py
          echo '        time.sleep(1)' >> set_boot.py
          echo 'os.remove("/bootflash/set_boot.py")' >> set_boot.py
          event manager applet BOOTCONFIG
           event syslog pattern "Configured from vty"
           action 1.0 cli python bootflash:set_boot.py
          #
          # The strength check is off only while the CHANGE_ME placeholders load,
          # and back on below, so the passwords set by hand must be strong.
          no password strength-check
          username admin password CHANGE_ME role network-admin
          #
          feature lacp
          feature lldp
          feature interface-vlan
          feature ospf
          #
          # Device Role for the tool's dedicated account (ADR 0005): the custom
          # role printed by `network-analyser role-snippet nx-os --username
          # netanalyser` (#53). After an allow-list change, regenerate it with
          # `python -m scripts.lab_roles`.
          role name NA-READ
            description Network Analyser read-only Device Role
            rule 1 permit command terminal length 0
            rule 2 permit command terminal width 511
            rule 3 permit command show version
            rule 4 permit command show user-account netanalyser
            rule 5 permit command show running-config
          username netanalyser password CHANGE_ME role NA-READ
          no username netanalyser role network-operator
          password strength-check
          #
          ip domain-name example.net
          #
          vlan 10
            name LAB-SHARED
          vlan 20
            name LAB-PAIR
          vlan 99
            name LAB-NATIVE
          #
          key chain OSPF-KEYS
            key 1
              key-string CHANGE_ME
              cryptographic-algorithm HMAC-SHA-256
          #
          router ospf 1
            router-id 203.0.113.104
          #
          interface mgmt0
            description Management (sandbox bridge)
            ip address 192.0.2.14/24
            no cdp enable
            no lldp transmit
            no lldp receive
            shutdown
          vrf context management
            ip route 0.0.0.0/0 192.0.2.1
          #
          interface loopback0
            ip address 203.0.113.104/32
            ip router ospf 1 area 0.0.0.0
          #
          interface port-channel1
            description Bundle to nx-sw2 port-channel1
            switchport
            switchport mode trunk
            switchport trunk allowed vlan 10,20
          #
          interface Ethernet1/1-2
            description Bundle member to nx-sw2
            switchport
            switchport mode trunk
            switchport trunk allowed vlan 10,20
            channel-group 1 mode active
            no shutdown
          #
          # Deliberate VLAN Mismatch: this end allows 10,20,99 with native VLAN 99;
          # xe-sw1 Ethernet0/3 allows 10,20,30 with native VLAN 1.
          interface Ethernet1/3
            description Trunk to xe-sw1 Ethernet0/3 (deliberate VLAN Mismatch)
            switchport
            switchport mode trunk
            switchport trunk native vlan 99
            switchport trunk allowed vlan 10,20,99
            no shutdown
          #
          interface Ethernet1/4
            description Routed link to xe-rtr1 GigabitEthernet3 (OSPF)
            no switchport
            ip address 203.0.113.5/31
            ip ospf network point-to-point
            ip ospf authentication key-chain OSPF-KEYS
            ip router ospf 1 area 0.0.0.0
            no shutdown
          #
          interface Vlan10
            description Shared subnet (all four switches)
            ip address 198.51.100.4/25
            ip ospf authentication key-chain OSPF-KEYS
            ip router ospf 1 area 0.0.0.0
            no shutdown
          #
          line vty
            exec-timeout 10
