    configuration:
      - name: iosxe_config.txt
        content: |-
          platform console serial
          !
          hostname xe-rtr1
          !
          ! Network Analyser lab node. Synthetic lab: every address is from the
          ! documentation ranges and every password, secret and key is CHANGE_ME.
          ! Set the login passwords by hand at the console, then bring
          ! GigabitEthernet1 up (docs/lab-checklist.md, "Set up the lab").
          !
          no ip domain lookup
          ip domain name example.net
          !
          service password-encryption
          enable algorithm-type scrypt secret CHANGE_ME
          !
          aaa new-model
          aaa authentication login default local
          aaa authorization exec default local
          !
          username admin privilege 15 algorithm-type scrypt secret CHANGE_ME
          !
          ! Device Role for the tool's dedicated account (ADR 0005): the CLI view
          ! printed by `network-analyser role-snippet ios-xe --username netanalyser`
          ! (#53), with the lab secret. After an allow-list change, regenerate it
          ! with `python -m scripts.lab_roles`.
          parser view NA-READ
           secret CHANGE_ME
           commands exec include terminal length 0
           commands exec include terminal width 511
           commands exec include show version
           commands exec include show privilege
           commands exec include show running-config view full
          !
          username netanalyser view NA-READ algorithm-type scrypt secret CHANGE_ME
          !
          login on-failure log
          login on-success log
          !
          crypto key generate rsa general-keys modulus 2048
          ip ssh version 2
          !
          vrf definition Mgmt-intf
           address-family ipv4
           exit-address-family
          !
          cdp run
          lldp run
          !
          key chain OSPF-KEYS
           key 1
            key-string CHANGE_ME
            cryptographic-algorithm hmac-sha-256
          !
          router ospf 1
           router-id 203.0.113.101
           passive-interface Loopback0
          !
          interface Loopback0
           ip address 203.0.113.101 255.255.255.255
           ip ospf 1 area 0
          !
          interface GigabitEthernet1
           description Management (sandbox bridge)
           vrf forwarding Mgmt-intf
           ip address 192.0.2.11 255.255.255.0
           no cdp enable
           no lldp transmit
           no lldp receive
           shutdown
          !
          interface GigabitEthernet2
           description Routed link to xe-sw1 Ethernet1/0 (OSPF)
           ip address 203.0.113.2 255.255.255.254
           cdp enable
           ip ospf network point-to-point
           ip ospf authentication key-chain OSPF-KEYS
           ip ospf 1 area 0
           no shutdown
          !
          interface GigabitEthernet3
           description Routed link to nx-sw1 Ethernet1/4 (OSPF)
           ip address 203.0.113.4 255.255.255.254
           cdp enable
           ip ospf network point-to-point
           ip ospf authentication key-chain OSPF-KEYS
           ip ospf 1 area 0
           no shutdown
          !
          interface GigabitEthernet4
           shutdown
          !
          ip route vrf Mgmt-intf 0.0.0.0 0.0.0.0 192.0.2.1
          !
          no ip http server
          no ip http secure-server
          !
          line vty 0 4
           exec-timeout 10 0
           transport input ssh
           transport output none
          !
          end
