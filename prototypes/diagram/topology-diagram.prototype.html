<title>Topology Diagram Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE: throwaway. Answers "What the network diagram looks like" (issue #13).
  Three structurally different diagram designs for the same synthetic Topology, switchable from the
  floating bar at the bottom (or ?variant=a|b|c, or #variant-a|b|c). Everything is synthetic: no real
  hostnames, IPs, serials or configs. Single self-contained file with no network calls, the same way the
  real diagram would have to work offline on the operator's Windows machine.
  The real tool would hide the prototype bar; nothing here is production code.
-->

<script>
'use strict';
/* =====================================================================
   Helpers
   ===================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={1:'VLAN on one end only',2:'Native VLAN differs',3:'Trunk faces access port',4:'Access VLAN differs'};
const NARROW=()=>window.innerWidth<760;
function fmtV(list){
  if(list==='all') return 'all';
  if(!list) return '—';
  if(!list.length) return 'none';
  const s=[...new Set(list)].sort((a,b)=>a-b), out=[]; let i=0;
  while(i<s.length){ let j=i; while(j+1<s.length&&s[j+1]===s[j]+1) j++; out.push(j>i+1?`${s[i]}-${s[j]}`:(j===i+1?`${s[i]},${s[j]}`:`${s[i]}`)); i=j+1; }
  return out.join(',');
}
function makeRng(seed){ return ()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }; }
const pad=n=>String(n).padStart(2,'0');

/* =====================================================================
   Synthetic Topology (shape follows the Topology model decision, #11)
   ===================================================================== */
function build(size){
  const N={size,devices:[],links:[],bundles:[],subnets:[],adj:[],segments:[]};
  let sn=4100; const ser=()=>'SYN'+(sn++)+'Q';
  const DB_ACC=[1,10,20,30,40,99], DB_DIST=[1,10,20,30,40,99,100], DB_CORE=[1,10,20,30,40,99,100,500,501,502], DB_LEAF=[1,500,501,502];
  const STD=[10,20,30,40,99], STD100=[10,20,30,40,99,100];
  const NX='NX-OS', XE='IOS-XE';
  const V=(id,platform,model,version,mgmt,o={})=>{const d=Object.assign({id,kind:'visited',hostname:id,platform,model,version,mgmt,serials:[ser()],aliases:[],stack:null,vlans:DB_ACC},o);N.devices.push(d);return d;};
  const U=(id,reason,o={})=>{const d=Object.assign({id,kind:'unvisited',label:id,reason,advPlatform:'',advIps:[],chassis:'',reportedBy:[]},o);N.devices.push(d);return d;};
  const T=(allowed,native=1)=>({mode:'trunk',allowed,native});
  const AC=v=>({mode:'access',vlan:v}); const R={mode:'routed'};
  let li=0; const L=(a,ai,b,bi,o={})=>{const l=Object.assign({id:'L'+(li++),a,ai,b,bi,status:'confirmed',src:['CDP','LLDP']},o);N.links.push(l);return l;};
  const B=(id,names,sideA,sideB,va,vb,o={})=>{const b=Object.assign({id,names,sideA,sideB,va,vb},o);N.bundles.push(b);return b;};
  const S=(prefix,vrf,note,members)=>{const s={id:'S:'+prefix+'@'+vrf,prefix,vrf,note,members};N.subnets.push(s);return s;};
  let ai=0; const AJ=(a,b,proto,detail)=>N.adj.push({id:'A'+(ai++),a,b,proto,detail});

  V('CORE-1',NX,'N9K-C93180YC-FX3','10.3(4a)','10.0.0.1',{aliases:['10.0.100.1','10.0.255.1'],vlans:DB_CORE});
  V('CORE-2',NX,'N9K-C93180YC-FX3','10.3(4a)','10.0.0.2',{aliases:['10.0.100.2','10.0.255.5'],vlans:DB_CORE});
  V('DIST-A1',XE,'C9500-48Y4C','17.9.4a','10.0.1.1',{vlans:DB_DIST});
  V('DIST-A2',XE,'C9500-48Y4C','17.9.4a','10.0.1.2',{vlans:DB_DIST});
  V('DIST-B',XE,'C9500-48Y4C (StackWise Virtual)','17.9.4a','10.0.1.3',{serials:[ser(),ser()],stack:['1: C9500-48Y4C','2: C9500-48Y4C'],vlans:DB_DIST});
  V('WAN-1',XE,'ISR4451-X','17.6.5','10.0.2.1',{vlans:null});
  V('WAN-2',XE,'ISR4451-X','17.6.5','10.0.2.2',{vlans:null});
  V('DC-LEAF-1',NX,'N9K-C93180YC-FX3','10.3(4a)','10.0.3.1',{vlans:DB_LEAF});
  V('DC-LEAF-2',NX,'N9K-C93180YC-FX3','10.3(4a)','10.0.3.2',{vlans:DB_LEAF});
  const acc=i=>'ACC-'+pad(i);
  for(let i=1;i<=12;i++){
    const stack=i%4===0;
    V(acc(i),XE,stack?'C9300-48P ×3 (stack)':'C9300-48P','17.9.4a','10.0.99.'+(20+i),
      Object.assign(stack?{serials:[ser(),ser(),ser()],stack:['1: C9300-48P','2: C9300-48P','3: C9300-48P']}:{}, i===3?{vlans:[1,10,20,30,40,99,150]}:{}));
  }
  // vPC peer-link, keepalive

    for(const [a,b] of E){ const ddx=X[a]-X[b], ddy=Y[a]-Y[b], d=Math.sqrt(ddx*ddx+ddy*ddy)||1, f=d/k; dx[a]-=ddx*f; dy[a]-=ddy*f; dx[b]+=ddx*f; dy[b]+=ddy*f; }
    for(let i=0;i<n;i++){ dx[i]-=X[i]*0.01; dy[i]-=Y[i]*0.01; const m=Math.hypot(dx[i],dy[i])||1, s=Math.min(m,temp); X[i]+=dx[i]/m*s; Y[i]+=dy[i]/m*s*0.8; }
    temp*=0.988;
  }
  const pos={}; ids.forEach((id,i)=>pos[id]={x:X[i],y:Y[i]});
  return N._force=pos;
}
function subnetPos(N,pos,dy){
  const out={}; N.subnets.forEach(s=>{ const ps=s.members.map(m=>pos[m[0]]).filter(Boolean); if(!ps.length)return;
    out[s.id]={x:ps.reduce((a,p)=>a+p.x,0)/ps.length,y:ps.reduce((a,p)=>a+p.y,0)/ps.length+dy}; });
  return out;
}

const REG=new Map();

function devNode(N,d,extra=''){

function edgeOf(e,o={}){
  const cls=[e.status,e.role];

  const s=sev(e); let badge=null;
  if(o.mism!==false&&s&&!(s==='noisy'&&o.noisy===false)){ cls.push(s); badge={bad:{t:'!',cls:'bad'},noisy:{t:'~',cls:'noisy'},unknown:{t:'?',cls:'unknown'}}[s]; }
  if(e.link&&e.link.conflict){ cls.push('conflict'); badge={t:'≠',cls:'conflict'}; }

  if(o.vlan) cls.push(vlanClass(e,o.vlan));
  return {id:e.id,a:e.a,b:e.b,cls:cls.join(' '),badge,mid:o.mid===false?'':mid,la:o.ifl?e.ai:'',lb:o.ifl?e.bi:'',ref:{type:'edge',e},
    title:`${e.a} ${e.ai} ⇄ ${e.b} ${e.bi}`};
}
function vlanClass(e,v){
  const c=e.check, inA=!!(c.ea&&c.ea.includes(v)), inB=!!(c.eb&&c.eb.includes(v));
  if(c.unknown||!c.ca||!c.cb) return (inA||inB)?'vlan-unk':'vlan-off';

function renderScene(g,sc){
  const P=sc.pos; let h='';
  const cnt=new Map(),idx=new Map();

  for(const e of sc.edges){
    const p1=P[e.a],p2=P[e.b]; if(!p1||!p2) continue;
    REG.set(e.id,e.ref);
    const n=cnt.get(e._k),i=idx.get(e._k)||0; idx.set(e._k,i+1);
    let off=(i-(n-1)/2)*16; if(e.a>e.b) off=-off;
    const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
    const cx=(p1.x+p2.x)/2+nx*off*2, cy=(p1.y+p2.y)/2+ny*off*2;
    const d=`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    const at=t=>({x:(1-t)*(1-t)*p1.x+2*(1-t)*t*cx+t*t*p2.x,y:(1-t)*(1-t)*p1.y+2*(1-t)*t*cy+t*t*p2.y});
    h+=`<g class="edge ${e.cls||''}" data-id="${esc(e.id)}" data-k="edge"><title>${esc(e.title||'')}</title><path class="hit" d="${d}"/><path class="ln" d="${d}"/>${/\bbundle\b/.test(e.cls)?`<path class="ln2" d="${d}"/>`:''}`;

    if(e.la||e.lb){ const t=Math.min(.42,(e.gap||78)/len);
      if(e.la){const q=at(t);h+=`<text class="lbl" x="${q.x.toFixed(1)}" y="${(q.y+3).toFixed(1)}" text-anchor="middle">${esc(e.la)}</text>`;}
      if(e.lb){const q=at(1-t);h+=`<text class="lbl" x="${q.x.toFixed(1)}" y="${(q.y+3).toFixed(1)}" text-anchor="middle">${esc(e.lb)}</text>`;} }
    if(e.badge) h+=`<g class="badge ${e.badge.cls}" transform="translate(${m.x.toFixed(1)},${m.y.toFixed(1)})"><circle r="8"/><text y="4" text-anchor="middle">${esc(e.badge.t)}</text></g>`;

  }

  for(const n of sc.nodes){
    const p=P[n.id]; if(!p) continue; REG.set(n.id,n.ref);
    const tr=`transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})"`;
    if(n.shape==='seg'){ h+=`<g class="node seg ${n.cls||''}" data-id="${esc(n.id)}" data-k="node" ${tr}><title>Shared Segment: an unmanaged switch or hub the tool cannot see</title><circle r="15"/><text class="t" y="4" text-anchor="middle">?</text><text class="s" y="29" text-anchor="middle">Shared Segment</text></g>`; continue; }
    if(n.shape==='subnet'){ const w=Math.max(96,n.t.length*6.4+18); h+=`<g class="node subnet ${n.cls||''}" data-id="${esc(n.id)}" data-k="node" ${tr}><title>${esc(n.title||'')}</title><rect x="${-w/2}" y="-11" width="${w}" height="22" rx="11"/><text class="t" y="4" text-anchor="middle">${esc(n.t)}</text></g>`; continue; }
    h+=`<g class="node ${n.cls||''}" data-id="${esc(n.id)}" data-k="node" ${tr}><rect x="-64" y="-20" width="128" height="40" rx="6"/>`+
      `<text class="t" y="-3" text-anchor="middle">${esc(n.t)}</text><text class="s" y="12" text-anchor="middle">${n.plat?`<tspan class="plat">${esc(n.plat)}</tspan> `:''}${esc(n.s)}</text></g>`;
  }

}
function boundsOf(sc){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  sc.nodes.forEach(n=>{const p=sc.pos[n.id]; if(!p)return; x0=Math.min(x0,p.x-70);x1=Math.max(x1,p.x+70);y0=Math.min(y0,p.y-30);y1=Math.max(y1,p.y+40);});
  (sc.labels||[]).forEach(l=>{x0=Math.min(x0,l.x);y0=Math.min(y0,l.y-16);x1=Math.max(x1,l.x+340);});
  return isFinite(x0)?{x0,y0,x1,y1}:{x0:-100,y0:-100,x1:100,y1:100};

function attachCanvas(svg,onPick){
  const g=svg.querySelector('.vp'), s={x:0,y:0,k:1};
  const apply=()=>g.setAttribute('transform',`translate(${s.x.toFixed(1)} ${s.y.toFixed(1)}) scale(${s.k.toFixed(4)})`);
  let drag=null,moved=false;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:s.x,sy:s.y,id:e.pointerId};moved=false;});
  svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>4){moved=true; try{svg.setPointerCapture(drag.id);}catch(_){}} if(moved){s.x=drag.sx+dx;s.y=drag.sy+dy;apply();} });
  const end=()=>{drag=null;}; svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('click',e=>{ if(moved){moved=false;return;} const t=e.target.closest('[data-id]'); onPick(t?{id:t.dataset.id,k:t.dataset.k}:null); });
  const zoomAt=(f,mx,my)=>{ const nk=Math.min(4,Math.max(0.05,s.k*f)); s.x=mx-(mx-s.x)*(nk/s.k); s.y=my-(my-s.y)*(nk/s.k); s.k=nk; apply(); };

  const api={
    fit(b){ const r=svg.getBoundingClientRect(); if(!r.width||!r.height)return; const bw=b.x1-b.x0,bh=b.y1-b.y0; const k=Math.min((r.width-40)/bw,(r.height-90)/bh,1.25);
      s.k=k; s.x=r.width/2-k*(b.x0+bw/2); s.y=(r.height-50)/2-k*(b.y0+bh/2); apply(); },
    zoom(f){ const r=svg.getBoundingClientRect(); zoomAt(f,r.width/2,r.height/2); },
    centerOn(p){ const r=svg.getBoundingClientRect(); s.k=Math.max(s.k,0.9); s.x=r.width/2-s.k*p.x; s.y=r.height/2-s.k*p.y; apply(); }
  };
  return api;
}

      <details class="legend" ${NARROW()?'':'open'}><summary>Legend</summary><ul>
        ${legendItem(lineSample('confirmed'),'Link, both ends see it')}${legendItem(lineSample('one-sided'),'Link, one end only')}
        ${legendItem(lineSample('inferred'),'inferred from MAC/ARP')}${legendItem(lineSample('bundle'),'Bundle (port-channel)')}
        ${legendItem(lineSample('bad'),'VLAN Mismatch <b>!</b>')}${legendItem(lineSample('noisy'),'VLAN on one end only <b>~</b>')}
        ${legendItem(lineSample('unknown'),'data unknown <b>?</b>')}${legendItem(lineSample('conflict'),'sources conflict <b>≠</b>')}
        ${legendItem(lineSample('l3 OSPF'),'L3: OSPF/EIGRP/BGP')}${legendItem('<rect x="3" y="1" width="28" height="10" rx="2" fill="var(--ghost)" stroke="var(--unk)" stroke-dasharray="3 2"/>','Unvisited Device')}
      </ul></details></div><aside class="drawer" id="a-drawer"></aside></div>`;
    const svg=$('#a-svg'), g=svg.querySelector('.vp');
    let sc=null;
    const cv=attachCanvas(svg,p=>{AS.pick=p;draw();});
    const draw=()=>{ sc=sceneA(N); renderScene(g,sc); $('#a-drawer').innerHTML=detail(N,AS.pick); };
    main.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{L[b.dataset.l]=!L[b.dataset.l];b.setAttribute('aria-pressed',L[b.dataset.l]);draw();});
    $('#a-vlan').oninput=e=>{AS.vlan=e.target.value.trim();draw();};
    $('#a-find').onchange=e=>{ const id=e.target.value.trim(); if(N.byId[id]){AS.pick={id,k:'node'};draw();cv.centerOn(sc.pos[id]);} };
    wireZoom(main,cv,()=>boundsOf(sc));
    draw(); cv.fit(boundsOf(sc));
  }
};
function sceneA(N){
  const L=AS.L, base=forceLayout(N), pos=Object.assign({},base);
  const show=id=>{const d=N.byId[id]; return d&&(L.unv||d.kind==='visited');};
  const vlan=parseInt(AS.vlan,10)||0;
  let nodes=[...N.devices,...N.segments].filter(d=>show(d.id)).map(d=>devNode(N,d));
  let edges=(L.members?N.physM:N.phys).filter(e=>show(e.a)&&show(e.b)).map(e=>edgeOf(e,{mism:L.mism,noisy:L.noisy,ifl:L.ifl,vlan}));
  if(L.l3){ const x=l3Scene(N,pos,show,-46); nodes=nodes.concat(x.nodes); edges=edges.concat(x.edges); }
  if(vlan) nodes.forEach(n=>{ const d=N.byId[n.id]; if(d&&d.kind==='visited'&&!(d.vlans||[]).includes(vlan)) n.cls+=' faded'; });
  const pk=AS.pick;
  if(pk){
    let keep;
    if(pk.k==='node'){ keep=neighbourSet(edges,pk.id); }
    else { const e=edges.find(x=>x.id===pk.id); keep=e?new Set([e.a,e.b]):null; }
    if(keep){ nodes.forEach(n=>{ if(n.id===pk.id) n.cls+=' sel'; else if(!keep.has(n.id)) n.cls+=' faded'; });
      edges.forEach(e=>{ if(e.id===pk.id) e.cls+=' sel'; else if(!(keep.has(e.a)&&keep.has(e.b)&&(pk.k!=='node'||e.a===pk.id||e.b===pk.id))) e.cls+=' faded';
        if(pk.k==='node'&&(e.a===pk.id||e.b===pk.id)){ e.la=e.la||(N.phys.concat(N.physM).find(x=>x.id===e.id)||{}).ai||''; e.lb=e.lb||(N.phys.concat(N.physM).find(x=>x.id===e.id)||{}).bi||''; } }); }
  }
  return {pos,nodes,edges};
}

/* =====================================================================
   Variant B: tiered layout, one tab per layer
   ===================================================================== */
const BS={tab:'phys',vlan:20,pick:null};
const VB={key:'b',name:'Tiered views, one per layer',
  blurb:'<b>B · Tiered views.</b> Devices in rows by distance from the core (worked out from the Links, since the Topology has no "role"), Unvisited Devices parked in their own lane grouped by reason. One tab per question: <b>Physical</b>, <b>Routing (L3)</b> and <b>VLAN</b>. Positions stay the same across tabs. Details dock at the bottom.',
  mount(main,N){
    const vl=[...new Set(N.devices.flatMap(d=>d.kind==='visited'?(d.vlans||[]):[]))].sort((a,b)=>a-b);
    if(!vl.includes(BS.vlan)) BS.vlan=vl[1]||vl[0];
    main.innerHTML=`<div class="b-wrap"><div class="b-tabs gut" role="tablist">
      <button class="tab" role="tab" data-t="phys">Physical</button><button class="tab" role="tab" data-t="l3">Routing (L3)</button><button class="tab" role="tab" data-t="vlan">VLAN</button>
      <label class="tb-field" id="b-vl">VLAN <select id="b-vsel">${vl.map(v=>`<option ${v===BS.vlan?'selected':''}>${v}</option>`).join('')}</select></label>
      <div class="b-key" id="b-key"></div></div>
      <div class="b-stage"><svg class="canvas" id="b-svg" aria-label="Topology diagram"><g class="vp"></g></svg>${zoomCtl()}</div>
      <div class="b-detail gut" id="b-detail"></div></div>`;
    const svg=$('#b-svg'), g=svg.querySelector('.vp'); let sc=null;
    const cv=attachCanvas(svg,p=>{BS.pick=p;draw();});
    const draw=()=>{
      main.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.t===BS.tab));
      $('#b-vl').hidden=BS.tab!=='vlan';
      sc=sceneB(N); renderScene(g,sc); $('#b-detail').innerHTML=detail(N,BS.pick); $('#b-key').innerHTML=sc.key||'';
    };
    main.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{BS.tab=t.dataset.t;draw();});
    $('#b-vsel').onchange=e=>{BS.vlan=parseInt(e.target.value,10);draw();};
    wireZoom(main,cv,()=>boundsOf(sc));
    draw(); cv.fit(boundsOf(sc));
  }
};
function sceneB(N){
  const T=tierLayout(N), pos=Object.assign({},T.pos), pk=BS.pick;
  const all=[...N.devices,...N.segments];
  let nodes=[],edges=[],key='';
  if(BS.tab==='phys'){
    nodes=all.map(d=>devNode(N,d));
    edges=N.phys.filter(e=>{ const toU=N.byId[e.a].kind==='unvisited'||N.byId[e.b].kind==='unvisited'; return !toU||(pk&&(e.a===pk.id||e.b===pk.id||e.id===pk.id)); })
      .map(e=>{ const touch=pk&&pk.k==='node'&&(e.a===pk.id||e.b===pk.id); const o=edgeOf(e,{ifl:touch});
      if(N.byId[e.a].kind==='unvisited'||N.byId[e.b].kind==='unvisited') o.cls+=' to-unv'; return o; });
    const s=N.stats; key=`<span><b style="color:var(--bad)">!</b> ${s.bad} mismatch</span><span><b style="color:var(--warn)">~</b> ${s.noisy} one end only</span><span><b>?</b> ${s.unknown} unknown</span><span><b style="color:var(--conflict)">≠</b> ${s.conflict} conflict</span>`;
  } else if(BS.tab==='l3'){
    const inL3=new Set(); N.subnets.forEach(s=>s.members.forEach(m=>inL3.add(m[0]))); N.adj.forEach(a=>{inL3.add(a.a);inL3.add(a.b);});
    nodes=all.filter(d=>d.kind==='visited'||inL3.has(d.id)).map(d=>devNode(N,d,inL3.has(d.id)?'':'faded'));
    const x=l3Scene(N,pos,id=>!!N.byId[id],62); nodes=nodes.concat(x.nodes); edges=x.edges;
    key='<span>Subnet = prefix shared by 3+ devices</span><span>dashed = routing protocol</span><span>faded = no L3 interfaces</span>';
  } else {
    const v=BS.vlan;
    nodes=all.map(d=>devNode(N,d,(d.kind==='visited'&&(d.vlans||[]).includes(v))?'':'faded'));
    edges=N.phys.map(e=>{ const o=edgeOf(e,{mism:false,vlan:v,mid:false}); return o; });
    const on=edges.filter(e=>/vlan-on/.test(e.cls)).length, br=edges.filter(e=>/vlan-break/.test(e.cls)).length, un=edges.filter(e=>/vlan-unk/.test(e.cls)).length;
    key=`<span style="color:var(--accent)"><b>${on}</b> carry VLAN ${v}</span><span style="color:var(--bad)"><b>${br}</b> stop at one end</span><span><b>${un}</b> unknown far end</span>`;
  }
  if(pk&&pk.k==='node') nodes.forEach(n=>{ if(n.id===pk.id) n.cls+=' sel'; });
  if(pk&&pk.k==='edge') edges.forEach(e=>{ if(e.id===pk.id) e.cls+=' sel'; });
  return {pos,nodes,edges,labels:T.labels,key};
}

/* =====================================================================
   Variant C: findings first, neighbourhood diagram on demand
   ===================================================================== */
const CS={sel:null,filter:'',pick:null};
const VC={key:'c',name:'Findings first, local diagram',
  blurb:'<b>C · Findings first.</b> No full map. The left column lists what needs attention, then everything else; picking an item draws only its neighbourhood, with interface names always on. Click a device in the drawing to walk to it. Scales to any size because it never draws the whole network.',
  mount(main,N){
    const F=N.findings, by=c=>F.filter(f=>f.cat===c);
    const fbtn=(f,i)=>`<button class="fi" data-f="${i}"><span class="dot ${f.cat==='onesided'||f.cat==='inferred'?'acc':f.cat}"></span>${esc(f.edge.a)} ⇄ ${esc(f.edge.b)}<span class="k">${esc(f.kind?KIND[f.kind]+': ':'')}${esc(f.text)}</span></button>`;
    const idx=f=>F.indexOf(f);
    const sec=(title,items,open,sub='')=>`<details ${open?'open':''}><summary>${title}<span class="n">${items.length}</span></summary>${sub?`<div class="sub">${sub}</div>`:''}${items.map(f=>fbtn(f,idx(f))).join('')||'<div class="sub">none</div>'}</details>`;
    const attn=[...by('bad'),...by('conflict')];
    const unvSec=`<details><summary>Unvisited Devices<span class="n">${N.stats.unv}</span></summary>${Object.keys(N.byReason).sort().map(r=>`<div class="rgh">${esc(r)} (${N.byReason[r].length})</div>${N.byReason[r].map(d=>`<button class="fi" data-d="${esc(d.id)}"><span class="dot unv"></span>${esc(d.label)}<span class="k">reported by ${esc(d.reportedBy.map(x=>x[0]).join(', '))}</span></button>`).join('')}`).join('')}</details>`;
    const devSec=`<details><summary>All Visited Devices<span class="n">${N.stats.vis}</span></summary><input class="c-filter" id="c-filter" placeholder="Filter by name or model" value="${esc(CS.filter)}"><div id="c-devs"></div></details>`;
    main.innerHTML=`<div class="c-wrap"><aside class="c-side">
      ${sec('Needs attention',attn,true,'VLAN Mismatches that break traffic, and conflicting evidence.')}
      ${sec('Not checked: data unknown',by('unknown'),true,'A command was refused or failed, so these are never called a Mismatch.')}
      ${sec('VLAN on one end only',by('noisy'),false,'Often harmless: "allowed all" facing a pruned list. Kept apart so it does not drown the rest.')}
      ${sec('One-sided Links between Visited Devices',by('onesided'),false)}
      ${sec('Inferred from MAC/ARP',by('inferred'),false)}
      ${unvSec}${devSec}</aside>
      <section class="c-main"><div class="c-stage"><div class="c-crumb" id="c-crumb"></div><svg class="canvas" id="c-svg" aria-label="Neighbourhood diagram"><g class="vp"></g></svg>${zoomCtl()}</div>
      <div class="c-detail gut" id="c-detail"></div></section></div>`;
    const svg=$('#c-svg'), g=svg.querySelector('.vp'); let sc=null;
    const cv=attachCanvas(svg,p=>{ if(p&&p.k==='node'&&N.byId[p.id]&&N.byId[p.id].kind!=='segment'){ select({centers:[p.id],pick:p,label:p.id}); } else if(p){ CS.pick=p; draw(false); } });
    const listDevs=()=>{ const q=CS.filter.toLowerCase(); $('#c-devs').innerHTML=N.devices.filter(d=>d.kind==='visited'&&(d.id+' '+d.model).toLowerCase().includes(q)).slice(0,80)
      .map(d=>`<button class="fi" data-d="${esc(d.id)}"><span class="dot acc"></span>${esc(d.id)}<span class="k">${esc(d.platform)} · ${esc(d.model)}</span></button>`).join(''); };
    const draw=(refit)=>{ sc=sceneC(N); renderScene(g,sc); $('#c-detail').innerHTML=detail(N,CS.pick); $('#c-crumb').textContent=CS.sel?CS.sel.label:'';
      main.querySelectorAll('.fi').forEach(b=>b.setAttribute('aria-current',(b.dataset.f!==undefined&&CS.sel&&String(CS.sel.f)===b.dataset.f)||(b.dataset.d&&CS.sel&&CS.sel.f===undefined&&CS.sel.centers[0]===b.dataset.d)?'true':'false'));
      if(refit) cv.fit(boundsOf(sc)); };
    const select=s=>{ CS.sel=s; CS.pick=s.pick; draw(true); };
    const selFinding=i=>{ const f=F[i]; select({f:i,centers:[f.edge.a,f.edge.b],focus:f.edge.id,pick:{id:f.edge.id,k:'edge'},label:`${f.edge.a} ⇄ ${f.edge.b}`}); };
    main.querySelector('.c-side').addEventListener('click',e=>{ const b=e.target.closest('.fi'); if(!b)return;
      if(b.dataset.f!==undefined) selFinding(+b.dataset.f); else select({centers:[b.dataset.d],pick:{id:b.dataset.d,k:'node'},label:b.dataset.d}); });
    $('#c-filter').oninput=e=>{CS.filter=e.target.value;listDevs();};
    listDevs(); wireZoom(main,cv,()=>boundsOf(sc));
    if(CS.sel&&CS.sel.centers.every(id=>N.byId[id])) select(CS.sel); else if(attn.length) selFinding(idx(attn[0])); else select({centers:[N.devices[0].id],pick:{id:N.devices[0].id,k:'node'},label:N.devices[0].id});
  }
};
function sceneC(N){
  const sel=CS.sel, cs=sel.centers, pos={}, nodes=[], edges=[];
  const rel=N.phys.filter(e=>cs.includes(e.a)||cs.includes(e.b));
  const nb=c=>[...new Set(rel.filter(e=>e.a===c||e.b===c).map(e=>e.a===c?e.b:e.a))].filter(x=>!cs.includes(x));
  const place=(list,cx,a0,a1)=>{ const n=list.length; if(!n)return; const span=a1-a0, R=Math.max(230,n*54/Math.max(span,0.5));
    list.sort().forEach((id,i)=>{ const a=n===1?(a0+a1)/2:a0+span*i/(n-1); pos[id]={x:cx+R*Math.cos(a),y:R*Math.sin(a)}; }); };
  if(cs.length===1){ pos[cs[0]]={x:0,y:0}; const l=nb(cs[0]); place(l,0,-Math.PI/2,-Math.PI/2+2*Math.PI*(1-1/Math.max(l.length,1))); }
  else { pos[cs[0]]={x:-190,y:0}; pos[cs[1]]={x:190,y:0};
    const n0=nb(cs[0]),n1=nb(cs[1]), shared=n0.filter(x=>n1.includes(x));
    place(n0.filter(x=>!shared.includes(x)),-190,Math.PI*0.62,Math.PI*1.38); place(n1.filter(x=>!shared.includes(x)),190,-Math.PI*0.38,Math.PI*0.38);
    shared.sort().forEach((id,i)=>pos[id]={x:0,y:(i%2?1:-1)*(170+Math.floor(i/2)*70)}); }
  Object.keys(pos).forEach(id=>nodes.push(devNode(N,N.byId[id],cs.includes(id)?'center':'')));
  rel.forEach(e=>{ if(!pos[e.a]||!pos[e.b])return; const o=edgeOf(e,{ifl:true}); o.gap=82; if(sel.focus&&e.id===sel.focus) o.cls+=' sel'; edges.push(o); });
  if(CS.pick&&CS.pick.k==='node') nodes.forEach(n=>{ if(n.id===CS.pick.id) n.cls+=' sel'; });
  return {pos,nodes,edges};
}

/* =====================================================================
   Shell: header stats, variant switcher, dataset switcher
   ===================================================================== */
const VARIANTS=[VA,VB,VC];
const DATA={};
let size='small';
const getN=()=>DATA[size]||(DATA[size]=build(size));
function pickVariant(){ let q=null; try{q=new URLSearchParams(location.search).get('variant');}catch(_){} const h=(location.hash.match(/^#variant-([abc])$/i)||[])[1]; const k=(h||q||'a').toLowerCase(); return VARIANTS.find(v=>v.key===k)?k:'a'; }
let cur=pickVariant();
function mount(){
  const N=getN(), V=VARIANTS.find(v=>v.key===cur), s=N.stats;
  $('#stats').innerHTML=`<span><b>${s.vis}</b> Visited</span><span><b>${s.unv}</b> Unvisited</span><span><b>${s.links}</b> Links</span><span><b>${s.bundles}</b> Bundles</span><span><b>${s.subnets}</b> Subnets</span><span class="bad"><b>${s.bad}</b> VLAN Mismatches</span><span class="warn"><b>${s.noisy}</b> one end only</span><span><b>${s.unknown}</b> unknown</span><span class="cf"><b>${s.conflict}</b> conflict${s.conflict===1?'':'s'}</span>`;
  $('#blurb').innerHTML=V.blurb;
  $('#sw-lab').textContent=`${V.key.toUpperCase()} · ${V.name}`;
  $('#sw-small').setAttribute('aria-pressed',size==='small'); $('#sw-large').setAttribute('aria-pressed',size==='large');
  REG.clear(); V.mount($('#main'),N);
}
function step(d){ const i=VARIANTS.findIndex(v=>v.key===cur); cur=VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length].key; try{ location.hash='variant-'+cur; }catch(_){ } mount(); }
window.addEventListener('hashchange',()=>{ const k=pickVariant(); if(k!==cur){cur=k;mount();} });
$('#sw-prev').onclick=()=>step(-1); $('#sw-next').onclick=()=>step(1);
const setSize=s=>{ if(s===size)return; size=s; AS.pick=BS.pick=CS.pick=null; CS.sel=null; mount(); };
$('#sw-small').onclick=()=>setSize('small'); $('#sw-large').onclick=()=>setSize('large');
document.addEventListener('keydown',e=>{ const t=e.target; if(t.closest&&t.closest('input,textarea,select,[contenteditable]'))return; if(e.key==='ArrowLeft')step(-1); else if(e.key==='ArrowRight')step(1); });
let rt=null; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(mount,250);});
mount();
</script>
